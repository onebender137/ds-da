    <script>
      // Live play counters — totals aggregated from each game's leaderboard
      (function () {
        var boards = ['dropblock/leaderboard.json', 'shatterblock/leaderboard.json', 'popper/leaderboard.json', 'slipstream/leaderboard.json', 'stunts/leaderboard.json', 'blockcrush/leaderboard.json', 'plumber-bob/leaderboard.json', 'dragon-slalom/leaderboard.json', 'tappycat/leaderboard.json', 'angry-nerds/leaderboard.json', 'neon-circuit/leaderboard.json'];
        Promise.all(boards.map(function (url) {
          return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return null; });
        })).then(function (results) {
          var totalSaves = 0, initials = {};
          results.forEach(function (d) {
            if (!d || !d.stats) return;
            totalSaves += d.stats.saves || 0;
            (d.stats.initials || []).forEach(function (x) { initials[x] = 1; });
          });
          var g = document.getElementById('statGames');
          var p = document.getElementById('statPlayers');
          if (g) g.textContent = String(totalSaves);
          if (p) p.textContent = String(Object.keys(initials).length);
        });
      })();
    </script>

    <script>
      // ---------- PWA: install banner + service worker ----------
      (function () {
        var banner = document.getElementById('installBanner');
        if (!banner) return;
        var steps = document.getElementById('installSteps');
        var btn = document.getElementById('installBtn');
        var close = document.getElementById('installClose');
        var titleEl = banner.querySelector('.install-title');
        function setOpen(open) {
          banner.classList.toggle('hidden', !open);
          document.body.classList.toggle('banner-open', open);
        }
        function persistOff() {
          try { localStorage.setItem('dsda-install-banner', 'off'); } catch (e) {}
          setOpen(false);
        }
        if (localStorage.getItem('dsda-install-banner') === 'off') setOpen(false);
        close.addEventListener('click', persistOff);
        var deferred = null;
        // Chrome (desktop + Android) offers the native install prompt:
        // swap the how-to for a real Install button when it fires.
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferred = e;
          if (steps) steps.style.display = 'none';
          if (btn) btn.hidden = false;
        });
        if (btn) btn.addEventListener('click', function () {
          if (!deferred) return;
          deferred.prompt();
          deferred.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') window.dispatchEvent(new CustomEvent('dsda-appinstall'));
          });
        });
        function installed() {
          deferred = null;
          if (steps) steps.style.display = 'none';
          if (btn) btn.hidden = true;
          if (titleEl) {
            titleEl.innerHTML = 'Installed — DSDA Arcade is on your home screen ✓<span class="install-sub">no browser bar, no friction — just tap and play</span>';
          }
          setTimeout(persistOff, 4200);
        }
        window.addEventListener('appinstalled', installed);
        window.addEventListener('dsda-appinstall', installed);
        // Service worker: installability + offline play (scope /games/)
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
          });
        }
      })();
    </script>

      let state = { phase: 'hall', zoom: 0, hover: -1, time: 0, paused: false, camX: 0, dragging: false, dragVel: 0, lastInteract: -10 };
      let ambLight, hemiLight, dirLight;   // theme-reactive lights

      const SCREEN_VERT = `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
      // CRT tube: barrel warp, rounded corners, scanlines that fade out when the
      // screen is too small on-page to resolve them (no moire), glass glare, and
      // the linear->sRGB output conversion (without it the screenshots render
      // dark and muddy).
      const SCREEN_FRAG = `
        uniform sampler2D uMap; uniform float uTime; uniform float uGlow; uniform float uDim;
        varying vec2 vUv;
        void main(){
          vec2 c = vUv - 0.5;
          vec2 uv = c * (1.0 + 0.16 * dot(c, c)) + 0.5;
          // rounded tube face
          vec2 q = max(abs(uv - 0.5) * 2.0 - 0.90, 0.0);
          float face = 1.0 - smoothstep(0.075, 0.10, length(q));
          // picture, with a hair of colour fringing toward the edges
          float ca = 0.0035 * dot(c, c);
          vec3 col = vec3(texture2D(uMap, uv + vec2(ca, 0.0)).r, texture2D(uMap, uv).g, texture2D(uMap, uv - vec2(ca, 0.0)).b);
          float lines = uv.y * 230.0;
          float keep  = clamp(1.0 - fwidth(lines) * 1.6, 0.0, 1.0);
          float scan  = 1.0 - 0.16 * keep * (0.5 + 0.5 * sin(lines * 6.2832 + uTime * 2.5));
          float flick = 0.985 + 0.015 * sin(uTime * 43.0) * sin(uTime * 29.0);
          float vig   = smoothstep(1.05, 0.25, length(c) * 1.45);
          col = col * uGlow * flick * scan * (0.45 + 0.55 * vig) * uDim;
          // phosphor floor + glass: a dead tube still catches the room
          col += vec3(0.010, 0.014, 0.024) * vig;
          float glare = smoothstep(0.30, 0.0, abs(vUv.x * 0.7 + vUv.y - 1.32));
          col += vec3(0.80, 0.88, 1.0) * (0.045 * glare + 0.03 * smoothstep(0.55, 1.0, vUv.y));
          gl_FragColor = vec4(col * face, 1.0);
          #include <colorspace_fragment>
        }`;

      // ---------- boot ----------
      try { boot(); } catch (err) {
        window.__bootErr = err;
        const e = document.getElementById('arcadeBootErr');
        e.style.display = 'block';
        e.textContent = err.stack || String(err);
      }

      function boot() {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x04070d);
        scene.fog = new THREE.Fog(0x04070d, 12, 30);

        camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(0, 1.42, CAM_DIST);
        camera.lookAt(0, 0.62, 0);

        buildRoom();
        buildCabinets();
        buildLights();
        buildCards();
        loadBoards();

        // Theme-reactive lighting: apply the current theme now, and re-light
        // the scene whenever the user flips the light/dark toggle.
        applySceneTheme(localStorage.getItem('dsda-theme') || 'light');
        window.addEventListener('dsda-theme-change', (e) => applySceneTheme(e.detail.theme));

        window.addEventListener('resize', onResize);
        // pointer events on window (not canvas) so mobile touches landing on the
        // .arcade-hall overlay (z-index 1, above the canvas) still drive the drag
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointerup', onPointerUp);
        // wheel on window too: the .arcade-hall overlay sits ABOVE the canvas in
        // the stacking order, so a canvas-only listener never saw the wheel and
        // the hall couldn't be scrolled with a mouse on desktop
        window.addEventListener('wheel', onWheel, { passive: false });
        setTimeout(hideDragHint, 6000);  // fade the hint even if the user never interacts

        window.__arcade = {
          pause()  { state.paused = true; },
          resume() { state.paused = false; },
          state()  { return { phase: state.phase, zoom: +state.zoom.toFixed(3), hover: state.hover, time: +state.time.toFixed(2), paused: state.paused, cams: cabinets.length, camX: +state.camX.toFixed(3), dragging: state.dragging }; },
          frame(ms) { advance((ms || 16.7) / 1000); render(); },
          play(i)  { startZoom(i); },
          pan(x)   { state.camX = x; },
          camX()   { return state.camX; },
          dragVel(){ return state.dragVel; },
          debug()  { return { phase: state.phase, time: +state.time.toFixed(2), lastInteract: +state.lastInteract.toFixed(2), camX: +state.camX.toFixed(3), dragVel: +state.dragVel.toFixed(3), dragging: state.dragging, paused: state.paused }; },
          camPos() { return camera.position.toArray(); },
          view()   { return { renderer, scene, camera }; }
        };

        requestAnimationFrame(loop);
      }

      function loop() {
        requestAnimationFrame(loop);
        if (state.paused) return;
        advance(Math.min(clock.getDelta(), 0.05));
        render();
      }
      function advance(dt) { state.time += dt; update(dt); }
      function render() { renderer.render(scene, camera); placeCards(); }

      // ---------- room ----------
      function buildRoom() {
        floorMat = new THREE.MeshStandardMaterial({ color: 0x0b1220, roughness: 0.32, metalness: 0.55 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        wallMat = new THREE.MeshStandardMaterial({ color: 0x070d18, roughness: 0.9, metalness: 0.1 });
        const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
        wall.position.set(0, 6, -3.4);
        scene.add(wall);

        const trim = new THREE.Mesh(
          new THREE.BoxGeometry(40, 0.025, 0.02),
          new THREE.MeshStandardMaterial({ color: GOLD, roughness: 0.35, metalness: 0.8, emissive: GOLD, emissiveIntensity: 0.25 })
        );
        trim.position.set(0, 2.6, -3.38);
        scene.add(trim);

        const cove = new THREE.Mesh(
          new THREE.BoxGeometry(40, 0.06, 0.06),
          new THREE.MeshStandardMaterial({ color: 0x223048, emissive: 0x2a3c5c, emissiveIntensity: 0.8 })
        );
        cove.position.set(0, 4.2, 1.2);
        scene.add(cove);
      }

      // ---------- cabinet ----------
      // Classic upright: two profiled side panels (gold T-molding on the edge,
      // per-game side art), a recessed CRT, a lit marquee box under a speaker
      // overhang, a sloped control panel and a coin door. Geometry + neutral
      // materials are built once and shared by every cabinet; anything coloured
      // by the game comes from gameKit() and is shared by that game's cabinets.
      function cabKit() {
        if (_kit) return _kit;
        const std = (color, roughness, metalness, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness, metalness }, extra || {}));
        const shape = new THREE.Shape();
        PROFILE.forEach(([z, y], i) => i ? shape.lineTo(z, y) : shape.moveTo(z, y));
        shape.closePath();
        const panel = new THREE.ExtrudeGeometry(shape, { depth: PANEL_T - 0.012, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, steps: 1 });
        panel.rotateY(-Math.PI / 2);       // shape x -> world z, extrusion -> world -x
        panel.translate(PANEL_T - 0.006, 0, 0);   // panel now spans x 0..PANEL_T

        const grille = document.createElement('canvas'); grille.width = 256; grille.height = 64;
        const g = grille.getContext('2d');
        g.fillStyle = '#0b1220'; g.fillRect(0, 0, 256, 64);
        g.fillStyle = '#02040a';
        for (let x = 20; x < 240; x += 9) g.fillRect(x, 14, 4, 36);
        const grilleTex = new THREE.CanvasTexture(grille); grilleTex.colorSpace = THREE.SRGBColorSpace;

        _kit = {
          geo: {
            panel,
            core:     new THREE.BoxGeometry(CAB_W, 1.88, 0.51),
            front:    new THREE.BoxGeometry(CAB_W, 0.78, 0.03),
            toe:      new THREE.BoxGeometry(CAB_W, 0.10, 0.03),
            under:    new THREE.BoxGeometry(CAB_W, 0.02, 0.20),
            nose:     new THREE.BoxGeometry(CAB_W, 0.08, 0.02),
            noseTrim: new THREE.BoxGeometry(CAB_W, 0.012, 0.006),
            deck:     new THREE.BoxGeometry(CAB_W, 0.03, 0.205),
            shaft:    new THREE.CylinderGeometry(0.008, 0.008, 0.075, 10),
            washer:   new THREE.CylinderGeometry(0.03, 0.034, 0.008, 20),
            ball:     new THREE.SphereGeometry(0.03, 20, 14),
            button:   new THREE.CylinderGeometry(0.024, 0.027, 0.018, 20),
            bezel:    new THREE.BoxGeometry(CAB_W, 0.575, 0.02),
            screen:   new THREE.PlaneGeometry(0.78, 0.439),
            strip:    new THREE.PlaneGeometry(0.78, 0.022),
            mqBox:    new THREE.BoxGeometry(CAB_W, 0.24, 0.26),
            mqFace:   new THREE.PlaneGeometry(CAB_W, 0.20),
            mqRail:   new THREE.BoxGeometry(CAB_W, 0.02, 0.014),
            speaker:  new THREE.BoxGeometry(CAB_W, 0.012, 0.172),
            door:     new THREE.BoxGeometry(0.30, 0.36, 0.012),
            slot:     new THREE.BoxGeometry(0.03, 0.062, 0.008),
            cup:      new THREE.BoxGeometry(0.06, 0.045, 0.008),
            lock:     new THREE.CylinderGeometry(0.011, 0.011, 0.008, 12)
          },
          mat: {
            body:    std(NAVY, 0.45, 0.35),
            dark:    std(0x0d1524, 0.5, 0.3),
            tube:    std(0x020306, 0.95, 0.0),     // matte bezel: soaks up the spotlight so the screen is the bright thing
            gold:    std(GOLD, 0.3, 0.85, { emissive: GOLD, emissiveIntensity: 0.12 }),
            deck:    std(0x111c30, 0.35, 0.45),
            chrome:  std(0xb8c2d0, 0.2, 0.9),
            door:    std(0x151f33, 0.35, 0.7),
            speaker: std(0xffffff, 0.8, 0.1, { map: grilleTex }),
            slotOn:  std(0x2a0803, 0.4, 0.2, { emissive: 0xff4a1c, emissiveIntensity: 1.6 }),
            slotOff: std(0x14090a, 0.5, 0.2)
          }
        };
        return _kit;
      }

      function drawMarquee(c, game) {
        const W = c.width, H = c.height, g = c.getContext('2d'), acc = css(game.accent);
        g.fillStyle = '#060d1a'; g.fillRect(0, 0, W, H);
        // backlight: accent bleeding in from both ends, gold wash top + bottom
        const side = g.createLinearGradient(0, 0, W, 0);
        side.addColorStop(0, acc); side.addColorStop(0.24, 'rgba(0,0,0,0)'); side.addColorStop(0.76, 'rgba(0,0,0,0)'); side.addColorStop(1, acc);
        g.globalAlpha = game.dark ? 0.10 : 0.42; g.fillStyle = side; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
        const grd = g.createLinearGradient(0, 0, 0, H);
        grd.addColorStop(0, 'rgba(201,162,39,0.20)'); grd.addColorStop(0.5, 'rgba(201,162,39,0)'); grd.addColorStop(1, 'rgba(201,162,39,0.20)');
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        g.strokeStyle = game.dark ? 'rgba(201,162,39,0.25)' : 'rgba(232,201,90,0.85)'; g.lineWidth = 4;
        g.strokeRect(14, 14, W - 28, H - 28);
        // title — shrink to fit so long names never clip
        g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        const title = game.name.toUpperCase();
        let px = 118;
        do { g.font = `700 ${px}px "Playfair Display", Georgia, "Times New Roman", serif`; px -= 4; } while (g.measureText(title).width > W - 150 && px > 48);
        if (!game.dark) { g.shadowColor = 'rgba(232,201,90,0.55)'; g.shadowBlur = 22; }
        g.fillStyle = game.dark ? 'rgba(201,162,39,0.4)' : '#f0d572';
        g.fillText(title, W / 2, 136);
        g.shadowBlur = 0;
        g.fillStyle = game.dark ? 'rgba(100,116,139,0.5)' : acc;
        g.fillRect(W / 2 - 110, 156, 220, 4);
        g.fillStyle = game.dark ? 'rgba(148,163,184,0.4)' : 'rgba(250,250,248,0.85)';
        g.font = '600 32px Inter, system-ui, sans-serif';
        g.fillText(game.tag.toUpperCase().split('').join(' '), W / 2, 204);
      }

      function drawSideArt(c, game) {
        // u runs back -> front, v runs floor -> top (canvas y is flipped)
        const W = c.width, H = c.height, g = c.getContext('2d'), acc = css(game.accent);
        const base = g.createLinearGradient(0, 0, 0, H);
        base.addColorStop(0, '#0d1b33'); base.addColorStop(1, '#060d1a');
        g.fillStyle = base; g.fillRect(0, 0, W, H);
        const band = (y0, wide, alpha, color) => {
          g.globalAlpha = alpha; g.fillStyle = color;
          g.beginPath(); g.moveTo(0, y0 + 300); g.lineTo(W, y0); g.lineTo(W, y0 + wide); g.lineTo(0, y0 + 300 + wide); g.closePath(); g.fill();
        };
        const k = game.dark ? 0.25 : 1;
        band(250, 150, 0.85 * k, acc);
        band(425, 46, 0.45 * k, acc);
        band(495, 10, 0.9 * k, '#c9a227');
        band(205, 10, 0.9 * k, '#c9a227');
        g.globalAlpha = 1;
        // no lettering here: the same art is mirrored onto the opposite panel
      }

      function gameKit(game) {
        if (_gameKits[game.id]) return _gameKits[game.id];
        const aniso = renderer.capabilities.getMaxAnisotropy();
        const tex = (w, h, draw) => {
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          draw(c, game);
          const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso;
          return t;
        };
        const marqueeTex = tex(1024, 238, drawMarquee);
        // the page's display font may land after boot — repaint the sign when it does
        if (document.fonts && document.fonts.load) {
          document.fonts.load('700 96px "Playfair Display"').then((f) => {
            if (f && f.length) { drawMarquee(marqueeTex.image, game); marqueeTex.needsUpdate = true; }
          }).catch(() => {});
        }
        const sideTex = tex(512, 1024, drawSideArt);
        sideTex.repeat.set(1 / PZW, 1 / PYH); sideTex.offset.set(-PZ0 / PZW, 0);
        const lit = game.dark ? 0.04 : 1;
        const shotTex = game.dark ? makeBlankTexture() : new THREE.TextureLoader().load(game.shot);
        shotTex.colorSpace = THREE.SRGBColorSpace; shotTex.anisotropy = aniso;
        const glow = (hex, i) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.3, metalness: 0.3, emissive: hex, emissiveIntensity: i * lit + 0.03 });
        return (_gameKits[game.id] = {
          marqueeTex, shotTex,
          side:  new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.5, metalness: 0.25 }),
          strip: new THREE.MeshBasicMaterial({ color: new THREE.Color(game.accent).multiplyScalar(game.dark ? 0.06 : 0.85) }),
          ball:  new THREE.MeshStandardMaterial({ color: game.accent, roughness: 0.18, metalness: 0.25, emissive: game.accent, emissiveIntensity: 0.12 * lit }),
          buttons: [glow(GOLD, 0.35), glow(game.accent, 0.55), glow(0xf4f1e8, 0.3)]
        });
      }

      function makeBlankTexture() {
        const c = document.createElement('canvas'); c.width = 64; c.height = 36;
        const g = c.getContext('2d');
        g.fillStyle = '#0a0f18'; g.fillRect(0, 0, 64, 36);
        return new THREE.CanvasTexture(c);
      }

      function makeCabinet(game, x) {
        const { geo, mat } = cabKit();
        const gk = gameKit(game);
        const grp = new THREE.Group();
        grp.position.set(x, 0, 0);

        // only the big silhouette pieces cast shadows (cheap shadow pass)
        const add = (parent, g, m, px, py, pz, rx = 0, shadow = false) => {
          const mesh = new THREE.Mesh(g, m);
          mesh.position.set(px, py, pz); mesh.rotation.x = rx;
          mesh.castShadow = shadow; mesh.receiveShadow = true;
          parent.add(mesh); return mesh;
        };

        // side panels: art on the faces, gold T-molding on the edge
        const panelMats = [gk.side, mat.gold];
        add(grp, geo.panel, panelMats,  CAB_W / 2, 0, 0, 0, true);
        add(grp, geo.panel, panelMats, -CAB_W / 2 - PANEL_T, 0, 0, 0, true);

        // carcass between the panels
        add(grp, geo.core,  mat.dark, 0, 0.94, -0.085, 0, true);
        add(grp, geo.front, mat.body, 0, 0.49, 0.285);
        add(grp, geo.toe,   mat.tube, 0, 0.05, 0.255);
        add(grp, geo.under, mat.dark, 0, 0.885, 0.385, -0.532);
        add(grp, geo.nose,  mat.dark, 0, 0.98, 0.462);
        add(grp, geo.noseTrim, mat.gold, 0, 1.012, 0.474);

        // coin door
        add(grp, geo.door, mat.door, 0, 0.52, 0.304);
        const slotMat = game.dark ? mat.slotOff : mat.slotOn;
        [-0.075, 0.075].forEach((sx) => {          // two coin mechs: lit slot over a reject cup
          add(grp, geo.slot, slotMat, sx, 0.60, 0.312);
          add(grp, geo.cup,  mat.tube, sx, 0.49, 0.312);
        });
        add(grp, geo.lock, mat.gold, 0, 0.635, 0.312, Math.PI / 2);

        // control panel (slopes down toward the player)
        const dk = new THREE.Group();
        dk.position.set(0, 1.055, 0.38); dk.rotation.x = 0.371; grp.add(dk);
        add(dk, geo.deck,   mat.deck,   0, -0.015, 0, 0, true);
        add(dk, geo.washer, mat.dark,   -0.2, 0.004, 0);
        add(dk, geo.shaft,  mat.chrome, -0.2, 0.04, 0);
        add(dk, geo.ball,   gk.ball,    -0.2, 0.095, 0);
        gk.buttons.forEach((bm, i) => add(dk, geo.button, bm, 0.06 + i * 0.085, 0.009, 0.012 - Math.abs(i - 1) * 0.022));

        // recessed CRT (leans back, sits behind the panel edges)
        const sg = new THREE.Group();
        sg.position.set(0, 1.369, 0.2055); sg.rotation.x = -0.1737; grp.add(sg);
        add(sg, geo.bezel, mat.tube, 0, 0, 0);
        const scrMat = new THREE.ShaderMaterial({
          uniforms: {
            uMap: { value: gk.shotTex },
            uTime: { value: 0 },
            uGlow: { value: 1 },
            uDim: { value: game.dark ? 0.05 : 1.0 }
          },
          vertexShader: SCREEN_VERT, fragmentShader: SCREEN_FRAG
        });
        const scr = new THREE.Mesh(geo.screen, scrMat);
        scr.position.set(0, 0.035, 0.012); sg.add(scr);
        add(sg, geo.strip, gk.strip, 0, -0.232, 0.012).receiveShadow = false;

        // marquee light box + speaker overhang
        add(grp, geo.mqBox, mat.dark, 0, 1.84, 0.205, 0, true);
        // self-lit sign: unlit basic material so the cabinet spotlight can't wash it out
        const mqMat = new THREE.MeshBasicMaterial({ map: gk.marqueeTex, color: 0xffffff });
        add(grp, geo.mqFace, mqMat, 0, 1.84, 0.337).receiveShadow = false;
        add(grp, geo.mqRail, mat.gold, 0, 1.95, 0.342);
        add(grp, geo.mqRail, mat.gold, 0, 1.73, 0.342);
        add(grp, geo.speaker, mat.speaker, 0, 1.688, 0.268, -0.359);

        scene.add(grp);
        return { group: grp, screen: scr, screenMat: scrMat, marqueeMat: mqMat, x, game, hoverGlow: game.dark ? 0 : 1.0 };
      }

      function buildCabinets() {
        for (let i = 0; i < NUM_CABS; i++) {
          const x = (i - (NUM_CABS - 1) / 2) * SPACING;
          const game = GAMES[(((i - (NUM_CABS - 1) / 2) % 11) + 11) % 11];
          cabinets.push(makeCabinet(game, x));
        }
      }

      // ---------- lights ----------
      function buildLights() {
        ambLight = new THREE.AmbientLight(0x223044, 0.8);
        scene.add(ambLight);
        hemiLight = new THREE.HemisphereLight(0x1c2a42, 0x05070c, 0.9);
        scene.add(hemiLight);

        // Sun-like directional light so cabinet shadows are visible in light
        // theme (kept very dim in dark theme so the neon look is unchanged).
        dirLight = new THREE.DirectionalLight(0xffffff, 0.12);
        dirLight.position.set(0, 9, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        const sc = dirLight.shadow.camera;
        sc.left = -14; sc.right = 14; sc.top = 10; sc.bottom = -10;
        sc.near = 1; sc.far = 30;
        dirLight.shadow.bias = -0.0015;
        scene.add(dirLight, dirLight.target);
        dirLight.target.position.set(0, 0, 0);

        cabinets.forEach(c => {
          if (c.game.dark) return;
          const spot = new THREE.SpotLight(0xffd9a0, SPOT_I, 14, 0.46, 0.55, 1.6);
          spot.position.set(c.x * 0.82, 4.1, 2.2);
          spot.target.position.set(c.x, 1.1, 0);
          spot.castShadow = false;   // enabled per-frame for near cabinets only
          spot.shadow.mapSize.set(512, 512);
          spot.shadow.bias = -0.002;
          scene.add(spot, spot.target);
          c.spot = spot;
          // screen glow spills onto the deck + floor, tinted by the game's accent
          const pl = new THREE.PointLight(new THREE.Color(0x9fc4ff).lerp(new THREE.Color(c.game.accent), 0.45), GLOW_I, 3.2, 2);
          pl.position.set(c.x, 1.36, 0.75);
          scene.add(pl);
          c.screenLight = pl;
        });
      }

      // Theme-reactive scene: light theme = bright hall with visible cabinet
      // shadows; dark theme = the original moody neon look (unchanged).
      // Mutates existing objects in place (no new Fog/Color) to avoid a full
      // shader recompile on toggle, which would freeze the render loop.
      function applySceneTheme(theme) {
        const light = theme === 'light';
        const bg = light ? 0xe9edf3 : 0x04070d;
        scene.background.setHex(bg);
        scene.fog.color.setHex(bg);
        scene.fog.near = light ? 16 : 12;
        scene.fog.far = light ? 42 : 30;
        if (floorMat) {
          floorMat.color.setHex(light ? 0x6d7888 : 0x0b1220);
          floorMat.roughness = light ? 0.85 : 0.32;
          floorMat.metalness = light ? 0.08 : 0.55;
        }
        if (wallMat) wallMat.color.setHex(light ? 0xc8d0db : 0x070d18);
        if (ambLight) { ambLight.color.setHex(light ? 0xffffff : 0x223044); ambLight.intensity = light ? 0.18 : 0.8; }
        if (hemiLight) { hemiLight.color.setHex(light ? 0xffffff : 0x1c2a42); hemiLight.groundColor.setHex(light ? 0x6d7888 : 0x05070c); hemiLight.intensity = light ? 0.5 : 0.9; }
        if (dirLight) dirLight.intensity = light ? 3.4 : 0.12;
      }

      // ---------- infinite row: world wrap ----------
      function shiftWorld(dx) {
        cabinets.forEach(c => {
          c.x += dx;
          c.group.position.x += dx;
          if (c.spot) { c.spot.position.x += dx; c.spot.target.position.x += dx; }
          if (c.screenLight) c.screenLight.position.x += dx;
        });
      }

      // ---------- HTML cards (projected under cabinets) ----------
      // innerHTML below uses only the local GAMES constants (no user input) — safe.
      function buildCards() {
        cabinets.forEach((c, i) => {
          const d = document.createElement('div');
          d.className = 'card';
          d.innerHTML = c.game.dark
            ? `<div class="name">${c.game.name}</div><div class="tag">${c.game.tag}</div><div class="desc">${c.game.desc}</div><div class="soon">\u2014 in development \u2014</div>`
            : `<div class="name">${c.game.name}</div><div class="tag">${c.game.tag}</div><div class="desc">${c.game.desc}</div><div class="stats" data-game="${c.game.id}">loading the record\u2026</div><button class="play" data-i="${i}">P L A Y</button>`;
          cardsEl.appendChild(d);
          c.card = d;
          if (!c.game.dark) d.querySelector('.play').addEventListener('click', () => startZoom(i));
        });
      }

      function loadBoards() {
        // one fetch per game; fill every card showing that game
        GAMES.filter(g => !g.dark).forEach(game => {
          fetch(game.board, { cache: 'no-store' })
            .then(r => r.ok ? r.json() : null)
            .then(j => {
              document.querySelectorAll(`.card .stats[data-game="${game.id}"]`).forEach(el => setStats(el, j && j.stats));
            })
            .catch(() => {
              document.querySelectorAll(`.card .stats[data-game="${game.id}"]`).forEach(el => setStats(el, null));
            });
        });
      }
      function setStats(el, stats) {
        if (stats && (stats.saves > 0 || (stats.initials && stats.initials.length))) {
          const g = stats.saves, p = stats.initials.length;
          el.innerHTML = `<b>${g}</b> game${g === 1 ? '' : 's'} \u00b7 <b>${p}</b> player${p === 1 ? '' : 's'} on the record`;
        } else {
          el.innerHTML = `the record is empty \u2014 <b>first score</b> goes to you`;
        }
      }

      // ---------- interaction: drag to pan, tap to play ----------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const drag = { active: false, moved: false, startX: 0, lastX: 0, lastTime: 0 };
      function onPointerDown(ev) {
        if (state.phase !== 'hall') return;
        // don't start a drag on interactive elements (header nav, theme toggle, buttons)
        if (ev.target.closest && ev.target.closest('a, button, .theme-toggle, .header nav, .game-stats')) return;
        drag.active = true; drag.moved = false;
        drag.startX = ev.clientX; drag.lastX = ev.clientX;
        drag.lastTime = performance.now();
        state.lastInteract = state.time;
        hideDragHint();
      }

      function onPointerMove(ev) {
        if (state.phase !== 'hall') return;
        if (drag.active) {
          const dx = ev.clientX - drag.lastX;
          // 6px tap tolerance so taps don't become drags
          if (!drag.moved && Math.abs(ev.clientX - drag.startX) > 6) {
            drag.moved = true;
            state.dragging = true;
            canvas.classList.add('dragging');
          }
          if (drag.moved) {
            const now = performance.now();
            const dtSec = Math.max((now - drag.lastTime) / 1000, 0.004);
            const dxWorld = dx * unitsPerPx();
            state.camX -= dxWorld;  // content follows the finger
            // smooth velocity from real event timing (avoids single-event spikes)
            state.dragVel = Math.max(-6, Math.min(6, state.dragVel * 0.5 + (dxWorld / dtSec) * 0.5));
            drag.lastX = ev.clientX;
            drag.lastTime = now;
            state.lastInteract = state.time;
            hideDragHint();
          }
          return;
        }
        state.hover = pickCabinet(ev);
        canvas.style.cursor = state.hover >= 0 && !cabinets[state.hover].game.dark ? 'pointer' : 'grab';
      }

      function unitsPerPx() {
        const worldH = 2 * CAM_DIST * Math.tan(23 * Math.PI / 180);
        return (worldH * camera.aspect) / window.innerWidth;
      }

      let dragHintGone = false;
      function hideDragHint() {
        if (dragHintGone) return;
        dragHintGone = true;
        const h = document.getElementById('dragHint');
        if (h) h.classList.add('hidden');
      }
      // desktop: mouse wheel / trackpad two-finger scroll pans the hall
      function onWheel(ev) {
        if (state.phase !== 'hall') return;
        // don't hijack the wheel over interactive UI (header nav, buttons, banner)
        var t = ev.target;
        if (t && t.closest && t.closest('a, button, .theme-toggle, .header, .install-banner')) return;
        ev.preventDefault();
        const raw = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
        const delta = Math.max(-140, Math.min(140, raw));
        state.camX -= delta * unitsPerPx();
        state.dragVel = 0;            // cancel any coasting
        state.lastInteract = state.time;
        hideDragHint();
      }

      function pickCabinet(ev) {
        pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(cabinets.map(c => c.group), true);
        if (!hits.length) return -1;
        let o = hits[0].object;
        while (o && cabinets.findIndex(c => c.group === o) < 0) o = o.parent;
        return o ? cabinets.findIndex(c => c.group === o) : -1;
      }

      function onPointerUp(ev) {
        if (state.phase !== 'hall') return;
        const wasTap = drag.active && !drag.moved;
        drag.active = false;
        state.dragging = false;
        canvas.classList.remove('dragging');
        state.lastInteract = state.time;
        if (wasTap) {
          const i = pickCabinet(ev);
          if (i >= 0 && !cabinets[i].game.dark) startZoom(i);
        }
      }

      // ---------- coin sound ----------
      function coin() {
        try {
          const ac = window.__ac || (window.__ac = new (window.AudioContext || window.webkitAudioContext)());
          const t0 = ac.currentTime;
          [[987.77, 0], [1318.51, 0.085]].forEach(([f, d]) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'square'; o.frequency.value = f;
            g.gain.setValueAtTime(0.09, t0 + d);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.2);
            o.connect(g).connect(ac.destination);
            o.start(t0 + d); o.stop(t0 + d + 0.22);
          });
        } catch (e) {}
      }

      // ---------- zoom transition ----------
      const zoomState = { i: -1, t: 0, toPos: null, toTgt: null, fromPos: null, fromTgt: null };

      function startZoom(i) {
        if (state.phase !== 'hall') return;
        const c = cabinets[i];
        const tgt = new THREE.Vector3();
        c.screen.getWorldPosition(tgt);
        const n = new THREE.Vector3(0, 0, 1).applyQuaternion(c.screen.getWorldQuaternion(new THREE.Quaternion()));
        zoomState.i = i; zoomState.t = 0;
        zoomState.toPos = tgt.clone().add(n.multiplyScalar(0.52));
        zoomState.toTgt = tgt;
        zoomState.fromPos = camera.position.clone();
        zoomState.fromTgt = new THREE.Vector3(state.camX, 1.10, 0);
        state.phase = 'zooming';
        document.body.classList.add('zooming');
        coin();
        try { gtag('event', 'arcade_play', { game: c.game.id }); } catch (e) {}
      }

      function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

      function update(dt) {
        const t = state.time;

        // attract mode + hover glow
        cabinets.forEach((c, i) => {
          c.screenMat.uniforms.uTime.value = t;
          if (c.game.dark) {
            c.hoverGlow += (0 - c.hoverGlow) * Math.min(1, dt * 5);
          } else {
            const target = (state.phase === 'zooming') ? 1.0 : (state.hover === i ? 1.35 : 1.0);
            c.hoverGlow += (target - c.hoverGlow) * Math.min(1, dt * 6);
          }
          c.screenMat.uniforms.uGlow.value = c.hoverGlow;
          const mqBase = c.game.dark ? 0.6 : 0.72;
          c.marqueeMat.color.setScalar(mqBase * (1 + 0.12 * Math.sin(t * 1.4 + i * 1.7)) * (state.phase === 'zooming' && zoomState.i === i ? 1.5 : 1));
        });

        // infinite horizontal drift + wrap
        if (state.phase === 'hall') {
          // inertia: coast after a released drag (decays to ~0 in ~1s)
          if (Math.abs(state.dragVel) > 0.01) {
            state.camX -= state.dragVel * dt;
            state.dragVel *= Math.pow(0.02, dt);
            state.lastInteract = state.time;
          } else {
            state.dragVel = 0;
          }
          // auto-drift only when idle: not dragging, not coasting, >2.5s since interaction
          if (!state.dragging && Math.abs(state.dragVel) < 0.01 && (t - state.lastInteract) > 2.5) state.camX += DRIFT * dt;
          if (state.camX > CYCLE_W / 2) { state.camX -= CYCLE_W; shiftWorld(-CYCLE_W); }
          else if (state.camX < -CYCLE_W / 2) { state.camX += CYCLE_W; shiftWorld(CYCLE_W); }
          // Re-center the finite cabinet window under the camera so the row is
          // truly infinite in both directions. The wrap above shifts the world by
          // exactly one cycle per pass, so the window drifts as you pan and would
          // eventually run out. The pattern is periodic with period CYCLE_W, so
          // snapping the world back by a whole number of cycles is seamless and
          // keeps the window centred on the camera forever.
          {
            const _c = cabinets[(cabinets.length - 1) / 2];
            const _r = state.camX - _c.x;
            if (Math.abs(_r) > CYCLE_W) shiftWorld(Math.round(_r / CYCLE_W) * CYCLE_W);
          }
          camera.position.x = state.camX;
          camera.lookAt(state.camX, 0.62, 0);
          // keep the shadow-casting sun over the visible cabinets, offset to
          // the side so shadows fall beside (not behind) the cabinets
          if (dirLight) {
            dirLight.position.set(state.camX + 4.5, 9, -3.5);
            dirLight.target.position.set(state.camX, 0, 0);
          }
          // shadows only for near cabinets (perf)
          cabinets.forEach(c => {
            if (c.spot) c.spot.castShadow = Math.abs(c.x - state.camX) < 9;
          });
        }

        // zoom
        if (state.phase === 'zooming') {
          zoomState.t = Math.min(1, zoomState.t + dt / 1.5);
          const e = easeInOutCubic(zoomState.t);
          camera.position.lerpVectors(zoomState.fromPos, zoomState.toPos, e);
          const lt = new THREE.Vector3().lerpVectors(zoomState.fromTgt, zoomState.toTgt, e);
          camera.lookAt(lt);
          state.zoom = e;
          cabinets.forEach(c => {
            const f = (c === cabinets[zoomState.i]) ? 1 : (1 - e);
            if (c.spot) c.spot.intensity = SPOT_I * f;
            if (c.screenLight) c.screenLight.intensity = GLOW_I * f;
          });
          if (zoomState.t >= 1) {
            state.phase = 'loading';
            location.assign(cabinets[zoomState.i].game.url);
          }
        }
      }

      // ---------- cards follow cabinets ----------
      const _v = new THREE.Vector3();
      function placeCards() {
        const w = window.innerWidth, h = window.innerHeight;
        // project anchors; only cards near the viewport are shown
        const visible = [];
        cabinets.forEach((c, i) => {
          _v.set(c.x, 0.02, 1.05).project(camera);
          const x = (_v.x * 0.5 + 0.5) * w;
          const y = (-_v.y * 0.5 + 0.5) * h;
          // where the cabinet's screen bottom edge projects — cards must stay below it
          _v.set(c.x, 1.13, 0.32).project(camera);
          const screenBottom = (-_v.y * 0.5 + 0.5) * h;
          const near = Math.abs(c.x - state.camX) < 11;
          if (near && x > -350 && x < w + 350) {
            c.card.style.display = 'block';
            visible.push({ c, i, x, y, screenBottom, ch: c.card.offsetHeight || 240 });
          } else {
            c.card.style.display = 'none';
          }
        });
        if (!visible.length) return;
        // common baseline across visible cards — lift off the screen bottom so
        // the floor (and cabinet shadows) stay visible in light theme
        let commonBottom = h - 188;
        visible.forEach(v => { commonBottom = Math.min(commonBottom, v.y + v.ch); });
        visible.forEach(v => {
          v.c.card.style.left = v.x + 'px';
          // never cover the cabinet screen: top edge stays below the screen's bottom
          const top = Math.max(commonBottom - v.ch, v.screenBottom + 4);
          v.c.card.style.top = top + 'px';
        });
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
</body>
</html>
