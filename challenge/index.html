<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge — DSDA Arcade</title>
  <meta name="description" content="A DSDA arcade challenge. Join, play, and climb the standings.">
  <style>
    :root{ color-scheme:dark; --bg:#080e14; --panel:rgba(10,16,24,.96); --line:rgba(108,255,178,.25); --gold:#ffd54a; --green:#6cffb2; --red:#ff6b6b; --ink:#dfe9ef; --dim:#8aa0ad; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{ background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; -webkit-font-smoothing:antialiased; }
    body::before{ content:''; position:fixed; inset:0; z-index:-2; background:radial-gradient(120% 80% at 50% -10%, #0e1a26 0%, var(--bg) 60%); }
    body::after{ content:''; position:fixed; inset:0; z-index:-1; background-image:linear-gradient(rgba(108,255,178,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(108,255,178,.04) 1px,transparent 1px); background-size:28px 28px; -webkit-mask-image:radial-gradient(80% 60% at 50% 30%,#000 40%,transparent 100%); mask-image:radial-gradient(80% 60% at 50% 30%,#000 40%,transparent 100%); }
    .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }
    .top{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .top a{ color:var(--dim); text-decoration:none; font-size:12px; letter-spacing:.12em; }
    .top a:hover{ color:var(--green); }
    .top .tag{ margin-left:auto; color:var(--gold); font-size:11px; letter-spacing:.2em; }
    .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.5); }
    .eyebrow{ color:var(--gold); font-size:11px; letter-spacing:.28em; margin:0 0 6px; }
    h1{ font-size:20px; letter-spacing:.06em; margin:0 0 4px; color:#fff; }
    .sub{ color:var(--dim); font-size:12px; margin:0 0 18px; }
    .status-line{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .pill{ font-size:11px; letter-spacing:.16em; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--green); }
    .pill.live{ color:var(--gold); border-color:rgba(255,213,74,.4); }
    .pill.settled{ color:var(--dim); }
    .pill.expired{ color:var(--red); border-color:rgba(255,107,107,.4); }
    .timeleft{ font-size:12px; color:var(--dim); }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
    .kv{ border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:12px; }
    .kv .k{ font-size:10px; letter-spacing:.18em; color:var(--dim); margin-bottom:6px; }
    .kv .v{ font-size:14px; color:#fff; }
    .section{ margin:18px 0; }
    .section .h{ font-size:11px; letter-spacing:.2em; color:var(--dim); margin:0 0 10px; }
    .player{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px; }
    .player:last-child{ border-bottom:none; }
    .player .h{ font-family:inherit; }
    .player .role{ margin-left:auto; font-size:10px; letter-spacing:.14em; color:var(--dim); }
    .player .you{ color:var(--gold); }
    .stand{ width:100%; border-collapse:collapse; font-size:12px; }
    .stand th{ text-align:left; font-size:10px; letter-spacing:.14em; color:var(--dim); padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.1); }
    .stand td{ padding:8px; border-bottom:1px solid rgba(255,255,255,.05); }
    .stand .score{ color:var(--green); font-weight:700; }
    .stand .rank{ color:var(--gold); font-weight:700; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .btn{ flex:1; min-width:140px; text-align:center; padding:13px 16px; border-radius:10px; font-family:inherit; font-size:13px; letter-spacing:.08em; cursor:pointer; text-decoration:none; border:1px solid var(--green); background:linear-gradient(180deg,rgba(108,255,178,.16),rgba(108,255,178,.05)); color:var(--green); transition:transform .05s ease, box-shadow .15s ease; }
    .btn:hover{ box-shadow:0 0 18px rgba(108,255,178,.25); }
    .btn:active{ transform:translateY(1px); }
    .btn.gold{ border-color:var(--gold); color:var(--gold); background:linear-gradient(180deg,rgba(255,213,74,.18),rgba(255,213,74,.05)); }
    .btn.ghost{ border-color:rgba(255,255,255,.18); color:var(--ink); background:transparent; }
    .btn[disabled]{ opacity:.45; cursor:default; }
    .link-box{ margin-top:18px; border:1px dashed rgba(255,213,74,.4); border-radius:10px; padding:12px; }
    .link-box .k{ font-size:10px; letter-spacing:.18em; color:var(--dim); margin-bottom:6px; }
    .link-box .row{ display:flex; gap:8px; }
    .link-box input{ flex:1; min-width:0; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.12); border-radius:8px; color:#fff; font-family:inherit; font-size:12px; padding:8px 10px; }
    .link-box button{ border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:8px; font-family:inherit; font-size:12px; padding:8px 12px; cursor:pointer; }
    .msg{ margin-top:14px; font-size:12px; min-height:16px; }
    .msg.err{ color:var(--red); }
    .msg.ok{ color:var(--green); }
    .empty{ color:var(--dim); font-size:13px; text-align:center; padding:30px 10px; }
    .empty .big{ font-size:15px; color:#fff; margin-bottom:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/games/">← ARCADE</a>
      <span class="tag">DSDA · CHALLENGE</span>
    </div>
    <div id="stage"></div>
  </div>

  <script>
    // Local dev override (prod uses same-origin /api/challenge on ds-da.ca).
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') window.DSDA_API_BASE = 'http://127.0.0.1:8787';
  </script>
  <script src="/challenge/challenge.js?v=2"></script>
  <script>
  (function () {
    'use strict';
    var CH = window.DSDA.challenge;
    var stage = document.getElementById('stage');
    var params = new URLSearchParams(location.search);
    var id = params.get('c');

    function card(innerHTML) { stage.innerHTML = '<div class="card">' + innerHTML + '</div>'; }

    function noId() {
      card(
        '<p class="eyebrow">NO CHALLENGE</p>' +
        '<h1>Pick a battle</h1>' +
        '<p class="sub">You need a challenge link to land here. Create one and send it to a friend.</p>' +
        '<div class="actions"><a class="btn gold" href="/challenge/new.html">＋ Create a challenge</a></div>'
      );
    }

    // innerHTML below is safe: every dynamic value (handle, title) goes through
    // CH.esc(); pill classes come from a trusted status map; game labels come
    // from the trusted gameLabel() constant. No raw user input is injected.
    function render(d) {
      var me = CH.account();
      var myHandle = me ? me.handle : '';
      var isMember = (d.players || []).some(function (p) { return p.handle === myHandle; });
      var isCreator = d.creator === myHandle;
      var st = d.status || 'open';
      var pillCls = (st === 'live' ? ' live' : st === 'settled' ? ' settled' : st === 'expired' ? ' expired' : '');
      var html = '';
      html += '<p class="eyebrow">' + (isCreator ? 'YOUR CHALLENGE' : 'CHALLENGE') + '</p>';
      html += '<h1>' + CH.esc(d.title || 'Challenge') + '</h1>';
      html += '<div class="status-line"><span class="pill' + pillCls + '">' + CH.status(st) + '</span><span class="timeleft">' + CH.timeLeft(d) + '</span></div>';
      html += '<div class="grid">';
      html += '<div class="kv"><div class="k">GAMES</div><div class="v">' + CH.gamesLabel(d.games) + '</div></div>';
      html += '<div class="kv"><div class="k">ATTEMPTS</div><div class="v">' + (d.attempts || 1) + ' each</div></div>';
      html += '<div class="kv"><div class="k">CREATOR</div><div class="v">' + CH.esc(d.creator) + '</div></div>';
      html += '<div class="kv"><div class="k">PLAYERS</div><div class="v">' + (d.players ? d.players.length : 0) + '</div></div>';
      html += '</div>';

      // Players
      html += '<div class="section"><div class="h">PLAYERS</div>';
      if (d.players && d.players.length) {
        d.players.forEach(function (p) {
          var role = p.is_creator ? 'CREATOR' : (p.status === 'accepted' ? 'IN' : p.status === 'invited' ? 'INVITED' : 'JOINED');
          var you = p.handle === myHandle ? ' you' : '';
          html += '<div class="player"><span>' + CH.esc(p.handle) + (you ? ' <span class="you">·YOU</span>' : '') + '</span><span class="role">' + role + '</span></div>';
        });
      } else {
        html += '<div class="player"><span style="color:var(--dim)">No one in yet</span></div>';
      }
      html += '</div>';

      // Live standings
      var standings = d.standings || [];
      if (standings.length && st !== 'settled') {
        html += '<div class="section"><div class="h">LIVE STANDINGS</div><table class="stand"><thead><tr><th>PLAYER</th>';
        (d.games || []).forEach(function (g) { html += '<th>' + CH.gameLabel(g) + '</th>'; });
        html += '</tr></thead><tbody>';
        standings.forEach(function (s) {
          html += '<tr><td>' + CH.esc(s.handle) + (s.handle === myHandle ? ' <span class="you" style="color:var(--gold)">·YOU</span>' : '') + '</td>';
          (d.games || []).forEach(function (g) {
            var sc = s.best ? s.best[g] : null;
            html += '<td class="score">' + (sc == null ? '—' : CH.esc(sc)) + '</td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }

      // Settled results
      var results = d.results || [];
      if (st === 'settled' && results.length) {
        html += '<div class="section"><div class="h">FINAL RESULT</div><table class="stand"><thead><tr><th>RANK</th><th>PLAYER</th><th>WINS</th><th>POINTS</th></tr></thead><tbody>';
        results.forEach(function (r) {
          html += '<tr><td class="rank">#' + r.rank + '</td><td>' + CH.esc(r.handle) + (r.handle === myHandle ? ' <span class="you" style="color:var(--gold)">·YOU</span>' : '') + '</td><td>' + (r.game_wins || 0) + '</td><td class="score">' + (r.points || 0) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }

      // Actions
      html += '<div class="actions" id="actions">';
      if (st === 'settled' || st === 'expired') {
        html += '<div style="width:100%;text-align:center;color:var(--dim);font-size:13px;">This challenge is ' + CH.status(st).toLowerCase() + '.</div>';
      } else if (!isMember) {
        if (myHandle) html += '<button class="btn gold" id="b-join">JOIN CHALLENGE</button>';
        else html += '<a class="btn gold" href="/games/challenge-login.html?next=' + encodeURIComponent(location.pathname + location.search) + '">LOG IN TO JOIN</a>';
      }
      if (isMember && st !== 'settled') {
        (d.games || []).forEach(function (g) {
          html += '<a class="btn" href="' + CH.playUrl(g, d.id) + '">▶ PLAY ' + CH.gameLabel(g).toUpperCase() + '</a>';
        });
      }
      html += '<button class="btn ghost" id="b-copy">COPY LINK</button>';
      html += '</div>';

      // Share link box
      html += '<div class="link-box"><div class="k">SHARE THIS LINK</div><div class="row"><input id="link" readonly value="' + CH.challengeUrl(d.id) + '"><button id="b-copy2">COPY</button></div></div>';

      card(html);

      // wire actions
      var join = document.getElementById('b-join');
      if (join) join.onclick = function () {
        join.disabled = true; join.textContent = 'JOINING…';
        CH.api('/' + d.id + '/accept', 'POST', {}).then(function (r) {
          if (r.ok) { document.getElementById('actions').innerHTML = '<div style="width:100%;text-align:center;color:var(--green);font-size:13px;">✓ You\'re in — hit PLAY above.</div>'; load(); }
          else { join.disabled = false; join.textContent = 'JOIN CHALLENGE'; flash('join', (r.j && r.j.error) || 'Could not join.'); }
        });
      };
      function copy() {
        var inp = document.getElementById('link');
        (navigator.clipboard ? navigator.clipboard.writeText(inp.value) : Promise.reject()).then(function () { flash('copy', 'Copied ✓'); }, function () { flash('copy', inp.value); });
      }
      var c1 = document.getElementById('b-copy'); if (c1) c1.onclick = copy;
      var c2 = document.getElementById('b-copy2'); if (c2) c2.onclick = copy;
    }

    function flash(which, text) {
      var m = document.getElementById('msg');
      if (!m) { m = document.createElement('div'); m.id = 'msg'; m.className = 'msg'; stage.querySelector('.card').appendChild(m); }
      m.textContent = text;
      m.className = 'msg ' + (which === 'copy' ? 'ok' : 'err');
      setTimeout(function () { m.textContent = ''; }, 3000);
    }

    function load() {
      CH.api('/' + id).then(function (r) {
        if (!r.ok || !r.j.id) {
          card('<p class="eyebrow">NOT FOUND</p><h1>No such challenge</h1><p class="sub">The link may be cut off, or the challenge was removed.</p><div class="actions"><a class="btn ghost" href="/games/">← Back to arcade</a></div>');
          return;
        }
        render(r.j);
        // live refresh for open/live challenges
        if (r.j.status === 'open' || r.j.status === 'live') {
          clearInterval(load._t);
          load._t = setInterval(function () {
            CH.api('/' + id).then(function (r2) { if (r2.ok && r2.j.id) render(r2.j); }).catch(function () {});
          }, 10000);
        }
      });
    }

    if (!id) { noId(); return; }
    load();
  })();
  </script>
</body>
</html>
