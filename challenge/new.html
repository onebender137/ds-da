<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Challenge — DSDA Arcade</title>
  <meta name="description" content="Create a DSDA arcade challenge and send the link to a friend.">
  <style>
    :root{ color-scheme:dark; --bg:#080e14; --panel:rgba(10,16,24,.96); --line:rgba(108,255,178,.25); --gold:#ffd54a; --green:#6cffb2; --red:#ff6b6b; --ink:#dfe9ef; --dim:#8aa0ad; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{ background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; -webkit-font-smoothing:antialiased; }
    body::before{ content:''; position:fixed; inset:0; z-index:-2; background:radial-gradient(120% 80% at 50% -10%, #0e1a26 0%, var(--bg) 60%); }
    body::after{ content:''; position:fixed; inset:0; z-index:-1; background-image:linear-gradient(rgba(108,255,178,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(108,255,178,.04) 1px,transparent 1px); background-size:28px 28px; -webkit-mask-image:radial-gradient(80% 60% at 50% 30%,#000 40%,transparent 100%); mask-image:radial-gradient(80% 60% at 50% 30%,#000 40%,transparent 100%); }
    .wrap{ max-width:560px; margin:0 auto; padding:28px 18px 60px; }
    .top{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .top a{ color:var(--dim); text-decoration:none; font-size:12px; letter-spacing:.12em; }
    .top a:hover{ color:var(--green); }
    .top .tag{ margin-left:auto; color:var(--gold); font-size:11px; letter-spacing:.2em; }
    .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.5); }
    .eyebrow{ color:var(--gold); font-size:11px; letter-spacing:.28em; margin:0 0 6px; }
    h1{ font-size:20px; letter-spacing:.06em; margin:0 0 4px; color:#fff; }
    .sub{ color:var(--dim); font-size:12px; margin:0 0 20px; }
    label.f{ display:block; font-size:10px; letter-spacing:.18em; color:var(--dim); margin:0 0 8px; }
    .games{ display:flex; gap:10px; margin-bottom:20px; }
    .game-pick{ flex:1; position:relative; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:14px; cursor:pointer; text-align:center; transition:border-color .15s ease, background .15s ease; }
    .game-pick input{ position:absolute; opacity:0; pointer-events:none; }
    .game-pick .ic{ font-size:26px; display:block; margin-bottom:6px; }
    .game-pick .nm{ font-size:12px; letter-spacing:.08em; color:var(--ink); }
    .game-pick.on{ border-color:var(--green); background:linear-gradient(180deg,rgba(108,255,178,.14),rgba(108,255,178,.04)); }
    .game-pick.on .nm{ color:var(--green); }
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
    select, input[type=text]{ width:100%; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.12); border-radius:10px; color:#fff; font-family:inherit; font-size:13px; padding:11px 12px; }
    select:focus, input[type=text]:focus{ outline:none; border-color:var(--green); }
    .invites .hint{ font-size:11px; color:var(--dim); margin-top:6px; }
    .btn{ width:100%; text-align:center; padding:14px 16px; border-radius:10px; font-family:inherit; font-size:14px; letter-spacing:.1em; cursor:pointer; border:1px solid var(--green); background:linear-gradient(180deg,rgba(108,255,178,.18),rgba(108,255,178,.05)); color:var(--green); transition:transform .05s ease, box-shadow .15s ease; margin-top:6px; }
    .btn:hover{ box-shadow:0 0 18px rgba(108,255,178,.25); }
    .btn[disabled]{ opacity:.5; cursor:default; }
    .msg{ margin-top:14px; font-size:12px; min-height:16px; }
    .msg.err{ color:var(--red); }
    .msg.ok{ color:var(--green); }
    .done{ text-align:center; }
    .done .big{ font-size:30px; margin-bottom:10px; }
    .link-box{ margin-top:18px; border:1px dashed rgba(255,213,74,.4); border-radius:10px; padding:12px; text-align:left; }
    .link-box .k{ font-size:10px; letter-spacing:.18em; color:var(--dim); margin-bottom:6px; }
    .link-box .row{ display:flex; gap:8px; }
    .link-box input{ flex:1; min-width:0; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.12); border-radius:8px; color:#fff; font-family:inherit; font-size:12px; padding:8px 10px; }
    .link-box button{ border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:8px; font-family:inherit; font-size:12px; padding:8px 12px; cursor:pointer; }
    .done .actions{ display:flex; gap:10px; margin-top:16px; }
    .done .actions a, .done .actions button{ flex:1; }
    .btn.ghost{ border-color:rgba(255,255,255,.18); color:var(--ink); background:transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/games/">← ARCADE</a>
      <span class="tag">DSDA · NEW CHALLENGE</span>
    </div>
    <div id="stage"></div>
  </div>

  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') window.DSDA_API_BASE = 'http://127.0.0.1:8787';
  </script>
  <script src="/challenge/challenge.js?v=2"></script>
  <script>
  (function () {
    'use strict';
    // innerHTML is safe: game/window labels come from the trusted GAMES/WINDOWS
    // constants; the challenge id in the link is a server-generated ulid.
    var CH = window.DSDA.challenge;
    var stage = document.getElementById('stage');
    var GAMES = [
      { key: 'tappycat', ic: '🐱', nm: 'TAPPYCAT' },
      { key: 'dropblock', ic: '🧱', nm: 'DROPBLOCK' }
    ];
    var WINDOWS = [
      { min: 60, label: '1 hour' },
      { min: 1440, label: '24 hours' },
      { min: 4320, label: '3 days' },
      { min: 10080, label: '7 days' }
    ];
    var DEFAULT_WINDOW = 1440; // 24 hours — long enough for a friend to actually play

    if (!CH.requireLogin('/challenge/new.html')) return;
    var me = CH.account();

    function form() {
      var gh = '';
      GAMES.forEach(function (g, i) {
        gh += '<label class="game-pick' + (i === 0 ? ' on' : '') + '" data-g="' + g.key + '"><input type="checkbox" value="' + g.key + '"' + (i === 0 ? ' checked' : '') + '><span class="ic">' + g.ic + '</span><span class="nm">' + g.nm + '</span></label>';
      });
      var wh = '';
      WINDOWS.forEach(function (w) {
        wh += '<option value="' + w.min + '"' + (w.min === DEFAULT_WINDOW ? ' selected' : '') + '>' + w.label + '</option>';
      });
      stage.innerHTML =
        '<div class="card">' +
        '<p class="eyebrow">NEW CHALLENGE</p>' +
        '<h1>Set the terms</h1>' +
        '<p class="sub">Pick the games, attempts and window. Then send the link to your friend — they join from the link.</p>' +
        '<label class="f">GAMES (PICK 1–2)</label>' +
        '<div class="games">' + gh + '</div>' +
        '<div class="row2">' +
        '<div><label class="f">ATTEMPTS EACH</label><select id="attempts"><option value="1" selected>1 (one-and-done)</option><option value="2">2</option><option value="3">3</option></select></div>' +
        '<div><label class="f">WINDOW</label><select id="window">' + wh + '</select></div>' +
        '</div>' +
        '<div class="invites"><label class="f">INVITE (OPTIONAL — COMMA-SEPARATED HANDLES)</label><input type="text" id="invites" placeholder="e.g. cory, neon_rider" autocomplete="off"><div class="hint">Leave blank for an open link — anyone with the link can join. Max 8 players total.</div></div>' +
        '<button class="btn" id="b-create">CREATE CHALLENGE</button>' +
        '<div class="msg" id="msg"></div>' +
        '</div>';
      bind();
    }

    function bind() {
      var picks = stage.querySelectorAll('.game-pick');
      picks.forEach(function (p) {
        p.addEventListener('change', function () {
          var on = stage.querySelectorAll('.game-pick.on');
          // cap at 2: if turning on a 3rd, ignore
          var checked = stage.querySelectorAll('.game-pick input:checked').length;
          if (checked > 2 && p.querySelector('input').checked) { p.querySelector('input').checked = false; return; }
          picks.forEach(function (q) { q.classList.toggle('on', q.querySelector('input').checked); });
        });
      });
      document.getElementById('b-create').onclick = create;
    }

    function msg(text, cls) { var m = document.getElementById('msg'); m.textContent = text || ''; m.className = 'msg ' + (cls || ''); }

    function create() {
      var games = Array.prototype.map.call(stage.querySelectorAll('.game-pick input:checked'), function (c) { return c.value; });
      if (games.length < 1) return msg('Pick at least one game.', 'err');
      var attempts = parseInt(document.getElementById('attempts').value, 10);
      var window_min = parseInt(document.getElementById('window').value, 10);
      var invitesRaw = document.getElementById('invites').value;
      var invites = invitesRaw.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(function (s) { return s.length >= 2; }).slice(0, 8);
      var btn = document.getElementById('b-create');
      btn.disabled = true; btn.textContent = 'CREATING…';
      CH.api('', 'POST', { games: games, attempts: attempts, window_min: window_min, invites: invites }).then(function (r) {
        if (r.ok && r.j.id) { done(r.j.id, games, window_min); return; }
        btn.disabled = false; btn.textContent = 'CREATE CHALLENGE';
        msg((r.j && r.j.error) || 'Could not create the challenge.', 'err');
      });
    }

    function done(id, games, window_min) {
      var wLabel = WINDOWS.filter(function (w) { return w.min === window_min; })[0];
      var url = CH.challengeUrl(id);
      stage.innerHTML =
        '<div class="card done">' +
        '<div class="big">🏁</div>' +
        '<p class="eyebrow">CHALLENGE CREATED</p>' +
        '<h1>Send the link</h1>' +
        '<p class="sub">' + CH.gamesLabel(games) + ' · ' + (wLabel ? wLabel.label : window_min + ' min') + ' window</p>' +
        '<div class="link-box"><div class="k">YOUR CHALLENGE LINK</div><div class="row"><input id="link" readonly value="' + url + '"><button id="b-copy">COPY</button></div></div>' +
        '<div class="actions"><a class="btn" id="b-view" href="' + url + '">VIEW CHALLENGE</a><button class="btn ghost" id="b-again">MAKE ANOTHER</button></div>' +
        '<div class="msg ok" style="margin-top:14px;">It closes ' + new Date(Date.now() + window_min * 60000).toLocaleString() + '. The winner is settled automatically when it closes.</div>' +
        '</div>';
      document.getElementById('b-copy').onclick = function () {
        var inp = document.getElementById('link');
        (navigator.clipboard ? navigator.clipboard.writeText(inp.value) : Promise.reject()).then(function () { inp.value = '✓ copied'; setTimeout(function () { inp.value = url; }, 1500); }, function () {});
      };
      document.getElementById('b-again').onclick = function () { form(); };
    }

    form();
  })();
  </script>
</body>
</html>
