<style>

  :root{ --bg:#0a0812;--panel:#12101e;--acc:#b967ff;--acc-dim:#6a3aa0;--glow:rgba(185,103,255,.42);--ink:#e8dcf5;--muted:#8a7aa0;--cred:#c8a8e8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; overflow:hidden;
    background-image:radial-gradient(circle at 50% 0%, var(--glow), transparent 55%), repeating-linear-gradient(90deg, rgba(185,103,255,.04) 0 2px, transparent 2px 8px);
  }
  .card{
    width:min(440px,100%); background:var(--panel);
    border:2px solid var(--acc-dim); border-radius:14px;
    box-shadow:0 0 40px var(--glow), inset 0 0 60px rgba(0,0,0,.55);
    padding:26px 24px 22px; position:relative;
  }
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .logo{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--glow))}
  .titles{flex:1;min-width:0}
  .freq{font-size:12px;letter-spacing:3px;color:var(--muted)}
  h1{font-size:26px;letter-spacing:2px;color:var(--acc);text-shadow:0 0 12px var(--glow);line-height:1.05}
  .tagline{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:var(--acc);
    border:1px solid var(--acc-dim);border-radius:6px;padding:5px 9px;flex:0 0 auto}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .now{background:rgba(0,0,0,.4);border:1px solid var(--acc-dim);border-radius:10px;padding:16px;margin-bottom:18px;
    min-height:96px;display:flex;flex-direction:column;justify-content:center}
  .now .label{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
  .now .track{font-size:18px;color:var(--acc);letter-spacing:1px;text-shadow:0 0 10px var(--glow);word-break:break-word}
  .now .artist{font-size:13px;color:var(--ink);margin-top:5px}
  .now .credit{font-size:11px;color:var(--cred);margin-top:8px;letter-spacing:.5px}
  .bar{height:5px;background:var(--glow);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .bar .fill{height:100%;width:0%;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .3s linear}
  .controls{display:flex;align-items:center;justify-content:center;gap:18px}
  .play{width:70px;height:70px;border-radius:50%;border:2px solid var(--acc);background:var(--glow);color:var(--acc);
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--glow);
    transition:transform .1s, background .15s}
  .play:active{transform:scale(.94)}
  .play svg{width:30px;height:30px}
  .share{width:48px;height:48px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);
    cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.8;transition:transform .1s,opacity .15s,box-shadow .15s}
  .share:active{transform:scale(.94)}
  .share:hover{opacity:1;box-shadow:0 0 16px var(--glow)}
  .share svg{width:20px;height:20px}

  .foot{margin-top:18px;text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px}
  .gate{position:absolute;inset:0;border-radius:12px;z-index:5;background:rgba(0,0,0,.88);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
  .gate .big{font-size:16px;letter-spacing:3px;color:var(--acc);text-shadow:0 0 12px var(--glow)}
  .gate .sub{font-size:11px;color:var(--muted);letter-spacing:1px}
  .gate.hidden{display:none}

</style>
</head>
<body>
  <div class="card">
    <div class="gate" id="gate">
      <svg width="54" height="54" viewBox="0 0 48 48" fill="none"><rect x="6" y="14" width="36" height="26" rx="4" stroke="#b967ff" stroke-width="2.5"/><circle cx="30" cy="27" r="7" stroke="#b967ff" stroke-width="2.5"/><circle cx="30" cy="27" r="2.5" fill="#b967ff"/><line x1="11" y1="22" x2="22" y2="22" stroke="#b967ff" stroke-width="2.5"/><line x1="11" y1="28" x2="20" y2="28" stroke="#b967ff" stroke-width="2"/><line x1="14" y1="6" x2="26" y2="14" stroke="#6a3aa0" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="big">TAP TO TUNE IN</div>
      <div class="sub">127.5 TRIPPED UP FM</div>
    </div>
    <div class="top">
      <svg class="logo" viewBox="0 0 48 48" fill="none"><rect x="6" y="14" width="36" height="26" rx="4" stroke="#b967ff" stroke-width="2.5"/><circle cx="30" cy="27" r="7" stroke="#b967ff" stroke-width="2.5"/><circle cx="30" cy="27" r="2.5" fill="#b967ff"/><line x1="11" y1="22" x2="22" y2="22" stroke="#b967ff" stroke-width="2.5"/><line x1="11" y1="28" x2="20" y2="28" stroke="#b967ff" stroke-width="2"/><line x1="14" y1="6" x2="26" y2="14" stroke="#6a3aa0" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="titles">
        <div class="freq">127.5 MHz</div>
        <h1>TRIPPED UP</h1>
        <div class="tagline">JAZZ · TRIPHOP · LATE NIGHT</div>
      </div>
      <div class="live"><span class="dot"></span>LIVE</div>
    </div>
    <div class="now">
      <div class="label">NOW PLAYING</div>
      <div class="track" id="track">Tuning in…</div>
      <div class="artist" id="artist"></div>
      <div class="credit" id="credit"></div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="controls">
      <button class="play" id="play" aria-label="Play">
        <svg id="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="share" id="share" aria-label="Share this station"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg></button>
    </div>
    <div class="foot">CC0 · HOLIZNACC0</div>
    <audio id="audio" preload="auto"></audio>
  </div>
<script>

(function(){

  // GA4 analytics (never breaks playback)
function track(event, params) {
  try { if (typeof gtag === 'function') gtag('event', event, Object.assign({ station: 'tripped-up', frequency: '127.5' }, params || {})); } catch(e) {}
}
  var MANIFEST = "manifest.json";
  var audio = document.getElementById('audio');
  var trackEl = document.getElementById('track');
  var artistEl = document.getElementById('artist');
  var creditEl = document.getElementById('credit');
  var fillEl = document.getElementById('fill');
  var playBtn = document.getElementById('play');
  var playIcon = document.getElementById('playicon');
  var gate = document.getElementById('gate');
  var shareBtn = document.getElementById('share');
  var shareSvg = shareBtn.innerHTML;
  shareBtn.addEventListener('click', function(){
    track('share');
    var data = {title: document.title, url: location.href};
    var check = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    function done(){ shareBtn.innerHTML = check; setTimeout(function(){ shareBtn.innerHTML = shareSvg; }, 1800); }
    if (navigator.share) { navigator.share(data).then(done).catch(function(){}); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(location.href).then(done).catch(done); }
    else { prompt('Copy this link:', location.href); }
  });


  var m = null, epoch = 0, total = 1, started = false;
  var curIdx = -1;

  function loadManifest(){
    return fetch(MANIFEST, {cache:'no-store'}).then(function(r){return r.json();});
  }
  // which item is live right now + offset into it
  function bcastPos(){
    var pos = ((Date.now()/1000 - epoch) % total + total) % total;
    var acc = 0;
    for (var i=0;i<m.program.length;i++){
      acc += m.program[i].duration;
      if (pos < acc) return {idx:i, offset:pos - (acc - m.program[i].duration)};
    }
    return {idx:m.program.length-1, offset:0};
  }
  function itemUrl(it){ return new URL(it.url, new URL(MANIFEST, location.href)).href; }

  function showItem(it){
    trackEl.textContent = it.title;
    artistEl.textContent = it.artist ? "— " + it.artist : "";
    creditEl.textContent = m.musicCredit || "";
  }

  // Point the <audio> at whatever is on air this second. The seek happens once
  // the file reports its length (a currentTime set before that is dropped on
  // iOS), and it re-reads the clock so load time doesn't put us behind.
  function loadLive(){
    var p = bcastPos(); curIdx = p.idx;
    var it = m.program[p.idx];
    showItem(it);
    audio.src = itemUrl(it);
    audio.addEventListener('loadedmetadata', function(){
      var q = bcastPos();
      if (q.idx !== curIdx) return;
      try { audio.currentTime = Math.max(0, Math.min(q.offset, (audio.duration || q.offset) - 0.2)); } catch(e) {}
    }, {once:true});
  }
  // Load the live item and play it. Rejects when the browser blocks autoplay.
  function tuneIn(){
    loadLive();
    return audio.play();
  }

  function tick(){
    if (!started) return;
    var p = bcastPos();
    if (p.idx !== curIdx){
      // a track that ran out also reads as paused, so check ended: only a real pause (or the gate) holds the audio back
      if (audio.paused && !audio.ended){ curIdx = p.idx; showItem(m.program[p.idx]); }
      else { tuneIn().catch(function(){}); }                             // on air: roll into the next item
    }
    fillEl.style.width = Math.min(100, (p.offset / m.program[p.idx].duration) * 100) + "%";
  }

  function setPlayIcon(playing){
    // innerHTML is safe here: fixed SVG path strings, not user input
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  playBtn.addEventListener('click', function(){
    if (!m) return;
    if (audio.paused){
      track('play');
      tuneIn().catch(function(){});     // always rejoin at the live position
    } else {
      track('pause');
      audio.pause(); setPlayIcon(false);
    }
  });
  // sound is actually coming out: drop the gate, show pause
  audio.addEventListener('playing', function(){ gate.classList.add('hidden'); setPlayIcon(true); });
  audio.addEventListener('pause', function(){ setPlayIcon(false); });

  // Autoplay was blocked: the first click or tap ANYWHERE on the page tunes in
  // (the gate is just the visible prompt for it).
  document.addEventListener('click', function(){
    if (!m || gate.classList.contains('hidden')) return;
    track('tune_in');
    tuneIn().catch(function(){});
  });

  loadManifest().then(function(data){
    m = data; epoch = data.epoch; total = data.totalDuration;
    started = true;
    setInterval(tick, 500);
    // Try to go on air straight away. Browsers allow this when the visitor has
    // already interacted with ds-da.ca (came from the dial, the home page, a
    // game); on a cold visit they refuse, and the TAP TO TUNE IN gate stays up.
    tuneIn().then(function(){ track('autoplay'); }).catch(function(){ tick(); });
  }).catch(function(e){
    trackEl.textContent = "Can't reach the signal";
    console.error(e);
  });
})();
</script>
</body>
</html>
