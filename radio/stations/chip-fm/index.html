<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>103.7 Chip FM — 8-bit chiptunes</title>
<meta property="og:title" content="103.7 Chip FM — DSDA Radio">
<meta property="og:description" content="Chiptunes & 8-bit, live off the DSDA Radio network.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ds-da.ca/radio/stations/chip-fm/">
<meta property="og:image" content="https://ds-da.ca/radio/stations/chip-fm/station-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="103.7 Chip FM — DSDA Radio">
<meta name="twitter:description" content="Chiptunes & 8-bit, live off the DSDA Radio network.">
<meta name="twitter:image" content="https://ds-da.ca/radio/stations/chip-fm/station-og.png">

<style>
  :root{
    --bg:#050705; --panel:#0a120a; --green:#39ff14; --green-dim:#1f7a0e;
    --green-glow:rgba(57,255,20,.45); --ink:#c8ffc0; --muted:#5f9f52;
    --amber:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:20px; overflow:hidden;
    /* CRT scanlines */
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  .crt{
    width:min(440px,100%); background:var(--panel);
    border:2px solid var(--green-dim); border-radius:14px;
    box-shadow:0 0 40px var(--green-glow), inset 0 0 60px rgba(0,0,0,.6);
    padding:26px 24px 22px; position:relative;
  }
  .crt::after{ /* vignette */
    content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none;
    box-shadow:inset 0 0 90px rgba(0,0,0,.7);
  }
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .logo{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--green-glow))}
  .titles{flex:1;min-width:0}
  .freq{font-size:12px;letter-spacing:3px;color:var(--muted)}
  h1{font-size:26px;letter-spacing:2px;color:var(--green);text-shadow:0 0 12px var(--green-glow);line-height:1.05}
  .tagline{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .live{
    display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;
    color:var(--green);border:1px solid var(--green-dim);border-radius:6px;
    padding:5px 9px;flex:0 0 auto;
  }
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .now{
    background:rgba(0,0,0,.4);border:1px solid var(--green-dim);border-radius:10px;
    padding:16px;margin-bottom:18px;min-height:96px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .now .label{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
  .now .track{font-size:18px;color:var(--green);letter-spacing:1px;text-shadow:0 0 10px var(--green-glow);word-break:break-word}
  .now .artist{font-size:13px;color:var(--ink);margin-top:5px}
  .now .credit{font-size:11px;color:var(--amber);margin-top:8px;letter-spacing:.5px}
  .bar{height:5px;background:rgba(57,255,20,.12);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .bar .fill{height:100%;width:0%;background:var(--green);box-shadow:0 0 10px var(--green);transition:width .3s linear}
  .controls{display:flex;align-items:center;justify-content:center;gap:18px}
  .play{
    width:70px;height:70px;border-radius:50%;border:2px solid var(--green);
    background:rgba(57,255,20,.08);color:var(--green);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 20px var(--green-glow);transition:transform .1s, background .15s;
  }
  .play:active{transform:scale(.94)}
  .play:hover{background:rgba(57,255,20,.16)}
  .play svg{width:30px;height:30px}
  .foot{margin-top:18px;text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px}
  /* mobile gate */
  .gate{
    position:absolute;inset:0;border-radius:12px;z-index:5;
    background:rgba(5,7,5,.92);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;cursor:pointer;
  }
  .gate .big{font-size:16px;letter-spacing:3px;color:var(--green);text-shadow:0 0 12px var(--green-glow)}
  .gate .sub{font-size:11px;color:var(--muted);letter-spacing:1px}
  .gate.hidden{display:none}
</style>
</head>
<body>
  <div class="crt">
    <div class="gate" id="gate">
      <svg width="54" height="54" viewBox="0 0 48 48" fill="none"><rect x="6" y="14" width="36" height="26" rx="4" stroke="#39ff14" stroke-width="2.5"/><circle cx="30" cy="27" r="7" stroke="#39ff14" stroke-width="2.5"/><circle cx="30" cy="27" r="2.5" fill="#39ff14"/><line x1="11" y1="22" x2="22" y2="22" stroke="#39ff14" stroke-width="2.5"/><line x1="11" y1="28" x2="20" y2="28" stroke="#39ff14" stroke-width="2"/><line x1="14" y1="6" x2="26" y2="14" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="big">TAP TO TUNE IN</div>
      <div class="sub">103.7 CHIP FM</div>
    </div>

    <div class="top">
      <svg class="logo" viewBox="0 0 48 48" fill="none"><rect x="6" y="14" width="36" height="26" rx="4" stroke="#39ff14" stroke-width="2.5"/><circle cx="30" cy="27" r="7" stroke="#39ff14" stroke-width="2.5"/><circle cx="30" cy="27" r="2.5" fill="#39ff14"/><line x1="11" y1="22" x2="22" y2="22" stroke="#39ff14" stroke-width="2.5"/><line x1="11" y1="28" x2="20" y2="28" stroke="#39ff14" stroke-width="2"/><line x1="14" y1="6" x2="26" y2="14" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="titles">
        <div class="freq">103.7 MHz</div>
        <h1>CHIP FM</h1>
        <div class="tagline">8-BIT CHIPTUNES · SQUARE WAVES</div>
      </div>
      <div class="live"><span class="dot"></span>LIVE</div>
    </div>

    <div class="now">
      <div class="label">NOW PLAYING</div>
      <div class="track" id="track">Tuning in…</div>
      <div class="artist" id="artist"></div>
      <div class="credit" id="credit"></div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="controls">
      <button class="play" id="play" aria-label="Play">
        <svg id="playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="foot">CC0 · HYDROGENE · NO CREDIT REQUIRED</div>
    <audio id="audio" preload="auto"></audio>
  </div>

<script>
(function(){
  var MANIFEST = "manifest.json";
  var audio = document.getElementById('audio');
  var trackEl = document.getElementById('track');
  var artistEl = document.getElementById('artist');
  var creditEl = document.getElementById('credit');
  var fillEl = document.getElementById('fill');
  var playBtn = document.getElementById('play');
  var playIcon = document.getElementById('playicon');
  var gate = document.getElementById('gate');

  var m = null, epoch = 0, total = 1, started = false;
  var curIdx = -1, curStart = 0;

  function loadManifest(){
    return fetch(MANIFEST, {cache:'no-store'}).then(function(r){return r.json();});
  }
  // which item is live right now + offset into it
  function bcastPos(){
    var pos = ((Date.now()/1000 - epoch) % total + total) % total;
    var acc = 0;
    for (var i=0;i<m.program.length;i++){
      acc += m.program[i].duration;
      if (pos < acc) return {idx:i, offset:pos - (acc - m.program[i].duration)};
    }
    return {idx:m.program.length-1, offset:0};
  }
  function itemUrl(it){ return new URL(it.url, new URL(MANIFEST, location.href)).href; }

  function showItem(it){
    trackEl.textContent = it.title;
    artistEl.textContent = it.artist ? "— " + it.artist : "";
    creditEl.textContent = m.musicCredit || "";
  }
  function tickProgress(){
    if (!started) return;
    var p = bcastPos();
    if (p.idx !== curIdx){
      curIdx = p.idx; curStart = p.offset;
      var it = m.program[p.idx];
      showItem(it);
      audio.src = itemUrl(it);
      audio.currentTime = p.offset;
      audio.play().catch(function(){});
    }
    var it = m.program[curIdx];
    var within = (Date.now()/1000) - curStart;
    fillEl.style.width = Math.min(100, (within / it.duration) * 100) + "%";
  }

  function start(){
    if (started) return; started = true;
    gate.classList.add('hidden');
    tickProgress();
    setInterval(tickProgress, 500);
  }

  function setPlayIcon(playing){
    // innerHTML is safe here: fixed SVG path strings, not user input
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function tryPlay(){
    if (!m) return;
    audio.play().then(function(){ setPlayIcon(true); })
      .catch(function(){ /* gate handles first gesture */ });
  }

  playBtn.addEventListener('click', function(){
    if (!m) return;
    if (audio.paused){
      // re-sync to live position
      var p = bcastPos(); curIdx = p.idx; curStart = p.offset;
      var it = m.program[p.idx];
      audio.src = itemUrl(it); audio.currentTime = p.offset;
      audio.play().then(function(){ setPlayIcon(true); }).catch(function(){});
    } else {
      audio.pause(); setPlayIcon(false);
    }
  });
  audio.addEventListener('play', function(){ setPlayIcon(true); });
  audio.addEventListener('pause', function(){ setPlayIcon(false); });

  gate.addEventListener('click', function(){
    start();
    tryPlay();
  });

  loadManifest().then(function(data){
    m = data; epoch = data.epoch; total = data.totalDuration;
    // pre-load the live item's metadata (don't play until gesture)
    var p = bcastPos(); curIdx = p.idx; curStart = p.offset;
    showItem(m.program[p.idx]);
  }).catch(function(e){
    trackEl.textContent = "Can't reach the signal";
    console.error(e);
  });
})();
</script>
</body>
</html>
