<style>
  :root{ --bg:#0a0a0a;--panel:#111111;--acc:#cc0000;--acc-dim:#660000;--glow:rgba(204,0,0,.42);--ink:#e8d5d5;--muted:#886666;--cred:#c8a0a0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Arial Black',Impact,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
    background-image:radial-gradient(circle at 50% 0%, var(--glow), transparent 55%),repeating-linear-gradient(115deg,rgba(204,0,0,.05) 0 2px,transparent 2px 9px);}
  .card{width:min(440px,100%);background:var(--panel);border:2px solid var(--acc-dim);border-radius:14px;box-shadow:0 0 40px var(--glow),inset 0 0 60px rgba(0,0,0,.55);padding:26px 24px 22px;position:relative}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px var(--glow))}
  .titles{flex:1;min-width:0}
  .freq{font-size:12px;letter-spacing:3px;color:var(--muted)}
  h1{font-size:26px;letter-spacing:2px;color:var(--acc);text-shadow:0 0 12px var(--glow);line-height:1.05}
  .tagline{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:var(--acc);border:1px solid var(--acc-dim);border-radius:6px;padding:5px 9px;flex:0 0 auto}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .vis{width:100%;height:64px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--acc-dim);margin-bottom:14px;overflow:hidden}
  .vis canvas{width:100%;height:100%;display:block}
  .ctrl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc-dim);background:rgba(204,0,0,.08);color:var(--acc);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .btn:hover{background:rgba(204,0,0,.18);box-shadow:0 0 12px var(--glow)}
  .btn.play{width:54px;height:54px;font-size:22px;background:rgba(204,0,0,.15)}
  .time{font-size:12px;color:var(--muted);letter-spacing:1px;flex:1;text-align:center}
  .now{background:rgba(0,0,0,.3);border:1px solid var(--acc-dim);border-radius:8px;padding:10px 14px;margin-bottom:12px}
  .now .label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
  .now .track{font-size:14px;color:var(--acc);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .artist{font-size:11px;color:var(--muted);margin-top:2px}
  .credit{font-size:10px;color:var(--cred);letter-spacing:.5px;line-height:1.5;text-align:center;padding-top:8px;border-top:1px solid rgba(204,0,0,.15)}
  .share{display:flex;justify-content:center;gap:8px;margin-top:10px}
  .share button{background:rgba(204,0,0,.08);border:1px solid var(--acc-dim);border-radius:6px;color:var(--muted);font-size:11px;padding:5px 12px;cursor:pointer;letter-spacing:1px;transition:all .15s}
  .share button:hover{color:var(--acc);background:rgba(204,0,0,.15)}
  .gate{position:absolute;inset:0;background:rgba(10,10,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;border-radius:12px;cursor:pointer}
  .gate .big{font-size:22px;color:var(--acc);letter-spacing:3px;text-shadow:0 0 16px var(--glow);margin-bottom:8px}
  .gate .sub{font-size:11px;color:var(--muted);letter-spacing:2px}
  .gate.hidden{display:none}
</style>
</head>
<body>
<script src="/radio/site-bar.js?v=3"></script>
<div class="card">
  <div class="gate" id="gate">
    <div class="big">TAP TO TUNE IN</div>
    <div class="sub">113.7 ARTIFICIAL BLACK FM</div>
  </div>
  <div class="top">
    <svg class="logo" viewBox="0 0 46 46" fill="none">
      <circle cx="23" cy="23" r="20" stroke="#cc0000" stroke-width="2" fill="rgba(204,0,0,.08)"/>
      <rect x="14" y="14" width="18" height="18" stroke="#cc0000" stroke-width="2" fill="none"/>
      <line x1="14" y1="23" x2="32" y2="23" stroke="#cc0000" stroke-width="1.5"/>
      <line x1="23" y1="14" x2="23" y2="32" stroke="#cc0000" stroke-width="1.5"/>
      <circle cx="23" cy="23" r="3" fill="#cc0000"/>
    </svg>
    <div class="titles">
      <div class="freq">113.7 FM</div>
      <h1>ARTIFICIAL BLACK</h1>
      <div class="tagline">dark electronic · glitch · wobble</div>
    </div>
    <div class="live"><span class="dot"></span>LIVE</div>
  </div>
  <div class="vis"><canvas id="visCanvas"></canvas></div>
  <div class="ctrl">
    <button class="btn" id="btnPrev" title="Previous">&#9198;</button>
    <button class="btn play" id="btnPlay" title="Play/Pause">&#9654;</button>
    <button class="btn" id="btnNext" title="Next">&#9197;</button>
    <div class="time" id="timeDisplay">--:--</div>
  </div>
  <div class="now">
    <div class="label">NOW PLAYING</div>
    <div class="track" id="nowTrack">Tuning in...</div>
    <div class="artist" id="nowArtist"></div>
  </div>
  <div class="credit" id="creditBox">Music: Artificial Black (artist) &middot; Host: bm_lewis (Kokoro TTS) &middot; DSDA Radio Network</div>
  <div class="share"><button id="btnShare">SHARE STATION</button></div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
(function(){
  const audio=document.getElementById('audio'),gate=document.getElementById('gate'),
    btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
    btnNext=document.getElementById('btnNext'),nowTrack=document.getElementById('nowTrack'),
    nowArtist=document.getElementById('nowArtist'),timeDisplay=document.getElementById('timeDisplay'),
    creditBox=document.getElementById('creditBox'),btnShare=document.getElementById('btnShare'),
    canvas=document.getElementById('visCanvas'),ctx=canvas.getContext('2d');
  let manifest=null,curIdx=-1,playing=false,audioCtx=null,analyser=null,srcNode=null;
  function resizeCanvas(){canvas.width=canvas.offsetWidth*(window.devicePixelRatio||1);canvas.height=canvas.offsetHeight*(window.devicePixelRatio||1)}
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  function drawVis(){requestAnimationFrame(drawVis);const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
    if(analyser&&playing){const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
      const bars=48,step=Math.floor(data.length/bars),bw=w/bars;
      for(let i=0;i<bars;i++){const v=data[i*step]/255,bh=v*h*.9;
        const g=ctx.createLinearGradient(0,h,0,h-bh);g.addColorStop(0,'rgba(204,0,0,.3)');g.addColorStop(1,'rgba(204,0,0,.9)');
        ctx.fillStyle=g;ctx.fillRect(i*bw+1,h-bh,bw-2,bh);}}
    else{ctx.fillStyle='rgba(204,0,0,.15)';for(let i=0;i<48;i++){ctx.fillRect(i*(w/48)+1,h-4,w/48-2,4);}}}
  drawVis();
  function setupAudioCtx(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=128;srcNode=audioCtx.createMediaElementSource(audio);
    srcNode.connect(analyser);analyser.connect(audioCtx.destination);}
  async function loadManifest(){try{const resp=await fetch('manifest.json',{cache:'no-store'});manifest=await resp.json();
    const elapsed=(Date.now()/1000-manifest.epoch)%manifest.totalDuration;let acc=0;
    for(let i=0;i<manifest.program.length;i++){acc+=manifest.program[i].duration;if(elapsed<acc){curIdx=i;break;}}
    if(curIdx<0)curIdx=0;}catch(e){console.error('Manifest load failed',e);}}
  function playIdx(idx){if(!manifest)return;curIdx=idx;const item=manifest.program[idx];
    audio.src=item.url;audio.currentTime=0;nowTrack.textContent=item.title;
    nowArtist.textContent=item.artist||(item.type==='announcement'?'Artificial Black FM':'');
    if(item.credit)creditBox.innerHTML=item.credit+'<br>Host: bm_lewis (Kokoro TTS) &middot; DSDA Radio Network';
    audio.play().then(()=>{playing=true;btnPlay.innerHTML='&#10074;&#10074;';
      if(window.gtag)gtag('event','play',{station:'artificial-black',track:item.title});}).catch(e=>{console.warn('Play failed',e);});}
  function nextIdx(){return manifest?(curIdx+1)%manifest.program.length:0}
  function prevIdx(){return manifest?(curIdx-1+manifest.program.length)%manifest.program.length:0}
  audio.addEventListener('ended',()=>{playIdx(nextIdx());});
  audio.addEventListener('timeupdate',()=>{const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);
    timeDisplay.textContent=`${m}:${s.toString().padStart(2,'0')}`;});
  function togglePlay(){if(!playing){setupAudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();
    if(!audio.src){playIdx(curIdx>=0?curIdx:0);}else{audio.play();playing=true;btnPlay.innerHTML='&#10074;&#10074;';}}
    else{audio.pause();playing=false;btnPlay.innerHTML='&#9654;';if(window.gtag)gtag('event','pause',{station:'artificial-black'});}}
  audio.addEventListener('playing',()=>{gate.classList.add('hidden');playing=true;btnPlay.innerHTML='&#10074;&#10074;';});
  audio.addEventListener('pause',()=>{if(!audio.ended)btnPlay.innerHTML='&#9654;';});
  document.addEventListener('click',()=>{if(!manifest||gate.classList.contains('hidden'))return;
    setupAudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();
    if(window.gtag)gtag('event','tune_in',{station:'artificial-black',frequency:'113.7'});playIdx(curIdx>=0?curIdx:0);});
  btnPlay.addEventListener('click',togglePlay);
  btnNext.addEventListener('click',()=>{playIdx(nextIdx());});
  btnPrev.addEventListener('click',()=>{playIdx(prevIdx());});
  btnShare.addEventListener('click',async()=>{const url=window.location.href;
    const text='113.7 Artificial Black FM — DSDA Radio. Dark electronic, glitch & wobble.';
    if(navigator.share){try{await navigator.share({title:'Artificial Black FM 113.7',text,url});}catch(e){}}
    else{await navigator.clipboard.writeText(url);btnShare.textContent='COPIED!';
      setTimeout(()=>btnShare.textContent='SHARE STATION',1500);}
    if(window.gtag)gtag('event','share',{station:'artificial-black'});});
  loadManifest().then(()=>{setupAudioCtx();playIdx(curIdx>=0?curIdx:0);});
})();
</script>
</body>
</html>
