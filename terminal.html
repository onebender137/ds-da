<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSDA // OS v1.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #030406; 
            font-family: 'Space Mono', monospace; 
            display: block; /* Override center flex */
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        #terminal-wrapper {
            border: 1px solid var(--cyan);
            height: calc(100% - 40px);
            background: rgba(0, 229, 255, 0.02);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.1);
            position: relative;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            color: var(--cyan);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }

        .input-line {
            display: flex;
            align-items: center;
            color: var(--gold);
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--gold);
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            margin-left: 10px;
        }

        .prompt { color: var(--purple); }
        .system-msg { color: var(--gold); text-transform: uppercase; }
        .intern-msg { color: #888; font-style: italic; }
        
        /* Custom Scrollbar for the Cyber Vibe */
        #output::-webkit-scrollbar { width: 5px; }
        #output::-webkit-scrollbar-track { background: transparent; }
        #output::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    
    <div id="terminal-wrapper">
        <div id="output">
            <div class="system-msg">Dream Syndicate Digital Assets // OS v1.0.4</div>
            <div class="system-msg">Establishing secure link to 3090 Syndicate... SUCCESS.</div>
            <br>
            <div>Type <span style="color:var(--gold)">'help'</span> to view available protocols.</div>
            <br>
        </div>
        
        <div class="input-line">
            <span class="prompt">DSDA_USER@NODE-01:~$</span>
            <input type="text" id="command-input" autofocus autocomplete="off">
        </div>
    </div>

    <script src="terminal-logic.js"></script>
</body>
</html>
