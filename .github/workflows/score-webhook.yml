name: Score Webhook

on:
  workflow_dispatch:
    inputs:
      initials:
        description: 'Player initials (max 3 chars)'
        required: true
        type: string
      score:
        description: 'Score (integer)'
        required: true
        type: string
      secret:
        description: 'Webhook secret'
        required: true
        type: string

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate + merge score
        env:
          IN_SECRET: ${{ inputs.secret }}
          IN_INIT: ${{ inputs.initials }}
          IN_SCORE: ${{ inputs.score }}
          EXPECTED_SECRET: ${{ secrets.SCORE_WEBHOOK_SECRET }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, time
          secret = os.environ.get('IN_SECRET', '')
          expected = os.environ.get('EXPECTED_SECRET', '')
          if not expected or secret != expected:
              sys.exit('secret mismatch')
          init = re.sub(r'[^A-Z0-9]', '', os.environ.get('IN_INIT', '').upper())
          init = (init + '???')[:3]
          try:
              score = int(float(os.environ.get('IN_SCORE', '0')))
          except ValueError:
              sys.exit('bad score')
          if score <= 0:
              sys.exit('score must be > 0')
          path = 'games/dropblock/leaderboard.json'
          with open(path) as f:
              data = json.load(f)
          top = data.get('top', [])
          top.append({'n': init, 's': score, 'd': int(time.time() * 1000)})
          top.sort(key=lambda e: e['s'], reverse=True)
          top = top[:10]
          data['top'] = top
          data['updated'] = int(time.time() * 1000)
          # play stats: every validated save = 1 game played; distinct initials ~= players
          stats = data.get('stats') or {'saves': 0, 'initials': []}
          stats['saves'] = stats.get('saves', 0) + 1
          initials = stats.get('initials', [])
          if init not in initials:
              initials.append(init)
          stats['initials'] = initials
          stats['players'] = len(initials)
          data['stats'] = stats
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print('merged board:', json.dumps(top))
          EOF

      - name: Commit + push
        run: |
          git config user.name "dsda-scores-bot"
          git config user.email "scores@ds-da.ca"
          # sanitize to alphanumerics only -> safe inside the commit message
          INIT=$(printf '%s' "$INITIALS_RAW" | tr -cd 'A-Z0-9' | cut -c1-3)
          SCORE=$(printf '%s' "$SCORE_RAW" | tr -cd '0-9')
          git add games/dropblock/leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m "leaderboard: ${INIT} scored ${SCORE}"
            git push
          else
            echo "board unchanged (score did not make top 5)"
          fi
        env:
          INITIALS_RAW: ${{ inputs.initials }}
          SCORE_RAW: ${{ inputs.score }}
